<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="main">
        <div class="main-left">
            <div class="header">
                <H1>Welcome To The Hive</H1>
            </div>
            <div class="login-body">
                <div class="input-name">
                    <p>Name</p>
                    <input type="text" class="input-text">
                </div>
                <div class="input-email">
                    <p>Email address</p>
                    <input type="email" name="" class="input-text">
                </div>
                <div class="input-password">
                    <p>Password</p>
                    <input type="password" name="" class="input-text">
                </div>
                <div class="check-terms-and-policy">
                    <input type="checkbox" name="terms-and-policy" id="" class="input-checbox">
                    <p>I agree to the <a href="#">Terms & Policy</a></p>
                </div>
                <div class="btn-container">
                <button class="sign-up-btn">Sign Up</button>
                </div>
            </div>
            <div class="bottom">
                <div class="bottom-top">
                    <p>--------or ------------</p>
                </div>
                <div class="bottom-down">
                    <div class="bottom-btns">
                        <button>Sign in with Google</button>
                        <button>Sign in with Apple</button>

                    </div>
                    <div class="login-referal-text">
                        <p>Have an account? <a href="#">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-right"><!--image inserted via css background in login.css-->
        </div>
    </div>
</body>
</html>
